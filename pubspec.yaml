name: mypaperhub
description: Offline-first personal academic paper repository with a local AI assistant.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0
  easy_localization: ^3.0.0
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  file_picker: ^8.1.3
  pdfx: ^2.6.0
  open_file: ^3.3.2
  http: ^1.2.0
  provider: ^6.1.2
  uuid: ^4.5.1
  syncfusion_flutter_pdf: ^28.1.33
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/en.json
    - assets/translations/es.json